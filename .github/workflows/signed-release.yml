name: Erthi Note Signed Release

# Manual only. Signing keys must never be committed.
# See docs/RELEASE_SIGNING.md for keystore setup instructions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Load signing material securely
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure all four signing secrets in Erthi-Org/Erthi-note repository settings first." >&2
            exit 1
          fi
          keyfile="$RUNNER_TEMP/erthi-note-production.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          test -s "$keyfile"
          echo "ANDROID_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"

      - name: Lint, unit tests, signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk" || { echo "::error::Release APK not found"; exit 1; }
          build_tools=$(ls "$ANDROID_SDK_ROOT/build-tools/" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$build_tools/apksigner" verify --verbose "$apk"

      - name: Generate SHA-256
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          sha256sum "$apk" > "${apk}.sha256"
          cat "${apk}.sha256"

      - name: Upload signed release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Erthi-Note-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
